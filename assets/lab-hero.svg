<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KENITOA portfolio flow hero</title>
  <desc id="desc">A clean portfolio board with connected flowchart nodes for Kenitoa's work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAF7"/>
      <stop offset=".52" stop-color="#EEF7F6"/>
      <stop offset="1" stop-color="#FFF4EF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#161719" flood-opacity=".15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#1C7773" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17181C}
      .mono{font-family:SFMono-Regular,Consolas,Liberation Mono,monospace;fill:#17181C}
      .muted{fill:#666A72}
      .title{font-size:58px;font-weight:850;letter-spacing:0}
      .h2{font-size:22px;font-weight:750}
      .small{font-size:13px}
      .chip{font-size:12px;font-weight:800;letter-spacing:.9px}
    </style>
  </defs>

  <rect width="1200" height="430" rx="30" fill="url(#bg)"/>
  <g opacity=".62">
    <animate attributeName="opacity" values=".48;.68;.48" dur="7s" repeatCount="indefinite"/>
    <path d="M84 76H1116M84 146H1116M84 216H1116M84 286H1116M84 356H1116" stroke="#D8DDDE"/>
    <path d="M152 44V386M324 44V386M496 44V386M668 44V386M840 44V386M1012 44V386" stroke="#E4E7E8"/>
  </g>

  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="8s" repeatCount="indefinite"/>
    <rect x="62" y="64" width="318" height="302" rx="18" fill="#FFFFFF" stroke="#17181C" stroke-width="2"/>
    <rect x="88" y="92" width="86" height="28" rx="14" fill="#F0C04A"/>
    <text x="106" y="111" class="mono chip">PROFILE</text>
    <text x="88" y="173" class="label title">KENITOA</text>
    <text x="91" y="213" class="label h2">Portfolio Flowboard</text>
    <text x="91" y="248" class="mono small muted">local tools / automation / archives</text>
    <path d="M92 292H330" stroke="#D4D8DA" stroke-width="2"/>
    <text x="92" y="325" class="mono small muted">idea -> interface -> proof -> record</text>
  </g>

  <path d="M380 215H456" stroke="#1C7773" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <circle cy="215" r="5" fill="#1C7773">
    <animate attributeName="cx" values="392;446;392" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;1;.15" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" dur="6.5s" repeatCount="indefinite"/>
    <rect x="456" y="174" width="142" height="82" rx="14" fill="#FFFFFF" stroke="#17181C" stroke-width="2"/>
    <text x="495" y="208" class="label h2">IDEA</text>
    <text x="485" y="233" class="mono small muted">rough signal</text>
  </g>

  <path d="M598 215H676" stroke="#1C7773" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.8s" begin=".4s" repeatCount="indefinite"/>
  </path>
  <circle cy="215" r="5" fill="#1C7773">
    <animate attributeName="cx" values="610;666;610" dur="2.8s" begin=".4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;1;.15" dur="2.8s" begin=".4s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="7s" repeatCount="indefinite"/>
    <rect x="676" y="82" width="216" height="74" rx="14" fill="#EAF9F7" stroke="#16827E" stroke-width="2"/>
    <text x="704" y="113" class="label h2">AI Runtime</text>
    <text x="704" y="137" class="mono small muted">local-ai / questions</text>

    <rect x="676" y="178" width="216" height="74" rx="14" fill="#FFF0EA" stroke="#C24B35" stroke-width="2"/>
    <text x="704" y="209" class="label h2">Workflow Tools</text>
    <text x="704" y="233" class="mono small muted">note / folder / search</text>

    <rect x="676" y="274" width="216" height="74" rx="14" fill="#FFF8E1" stroke="#B9770E" stroke-width="2"/>
    <text x="704" y="305" class="label h2">Spatial Archive</text>
    <text x="704" y="329" class="mono small muted">game / 3D / history</text>
  </g>

  <path d="M892 119C936 119 936 215 972 215" stroke="#16827E" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <path d="M892 215H972" stroke="#C24B35" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3.2s" begin=".3s" repeatCount="indefinite"/>
  </path>
  <path d="M892 311C936 311 936 215 972 215" stroke="#B9770E" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3.2s" begin=".6s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="7.5s" repeatCount="indefinite"/>
    <rect x="972" y="148" width="164" height="134" rx="20" fill="#FFFFFF" stroke="#17181C" stroke-width="2"/>
    <rect x="1000" y="169" width="72" height="24" rx="12" fill="#EAF9F7"/>
    <text x="1016" y="186" class="mono chip" fill="#16827E">END</text>
    <text x="1000" y="221" class="label h2">Public</text>
    <text x="1000" y="248" class="label h2">Record</text>
    <text x="1000" y="267" class="mono small muted">readable repo</text>
  </g>
</svg>
