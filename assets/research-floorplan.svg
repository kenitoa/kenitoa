<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KENITOA repository routing map</title>
  <desc id="desc">A flowchart map of Kenitoa public repositories grouped by local intelligence, human workflow, and spatial archive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFBF8"/>
      <stop offset=".5" stop-color="#F2F7F8"/>
      <stop offset="1" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1A1A1A" flood-opacity=".12"/>
    </filter>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" stroke="#16827E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" stroke="#C24B35" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" stroke="#B9770E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17181C}
      .mono{font-family:SFMono-Regular,Consolas,Liberation Mono,monospace;fill:#17181C}
      .muted{fill:#646872}
      .title{font-size:28px;font-weight:820}
      .node{font-size:17px;font-weight:750}
      .small{font-size:12px}
      .chip{font-size:11px;font-weight:800;letter-spacing:.9px}
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <g opacity=".55">
    <animate attributeName="opacity" values=".42;.62;.42" dur="8s" repeatCount="indefinite"/>
    <path d="M72 80H1128M72 160H1128M72 240H1128M72 320H1128M72 400H1128M72 480H1128" stroke="#DADFE0"/>
    <path d="M168 50V510M336 50V510M504 50V510M672 50V510M840 50V510M1008 50V510" stroke="#E4E7E7"/>
  </g>

  <text x="72" y="56" class="label title">Repository Routing Map</text>
  <text x="840" y="56" class="mono small muted">portfolio view / public repositories / flowchart layout</text>

  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="6s" repeatCount="indefinite"/>
    <rect x="72" y="112" width="210" height="70" rx="14" fill="#FFFFFF" stroke="#17181C" stroke-width="2"/>
    <rect x="98" y="128" width="68" height="22" rx="11" fill="#F0C04A"/>
    <text x="113" y="144" class="mono chip">START</text>
    <text x="98" y="169" class="label node">rough idea</text>
  </g>

  <g stroke-width="3" fill="none">
    <path d="M282 147H358" stroke="#16827E" stroke-dasharray="10 12" marker-end="url(#arrowTeal)">
      <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M282 147C324 147 316 280 358 280" stroke="#C24B35" stroke-dasharray="10 12" marker-end="url(#arrowRed)">
      <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3s" begin=".3s" repeatCount="indefinite"/>
    </path>
    <path d="M282 147C324 147 316 413 358 413" stroke="#B9770E" stroke-dasharray="10 12" marker-end="url(#arrowGold)">
      <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3s" begin=".6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="6.8s" repeatCount="indefinite"/>
    <rect x="358" y="96" width="240" height="102" rx="16" fill="#EAF9F7" stroke="#16827E" stroke-width="2"/>
    <text x="386" y="130" class="mono chip" fill="#16827E">FLOW 01</text>
    <text x="386" y="158" class="label node">Local Intelligence</text>
    <text x="386" y="182" class="mono small muted">local-ai -> text-to-make-question</text>
  </g>

  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" dur="7.1s" repeatCount="indefinite"/>
    <rect x="358" y="229" width="240" height="102" rx="16" fill="#FFF0EA" stroke="#C24B35" stroke-width="2"/>
    <text x="386" y="263" class="mono chip" fill="#C24B35">FLOW 02</text>
    <text x="386" y="291" class="label node">Human Workflow</text>
    <text x="386" y="315" class="mono small muted">CozyNote -> folder -> search -> builder</text>
  </g>

  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="7.4s" repeatCount="indefinite"/>
    <rect x="358" y="362" width="240" height="102" rx="16" fill="#FFF8E1" stroke="#B9770E" stroke-width="2"/>
    <text x="386" y="396" class="mono chip" fill="#B9770E">FLOW 03</text>
    <text x="386" y="424" class="label node">Spatial Archive</text>
    <text x="386" y="448" class="mono small muted">MuWorld -> 3D -> War-Achive -> web</text>
  </g>

  <path d="M598 147H706" stroke="#16827E" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrowTeal)">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.7s" repeatCount="indefinite"/>
  </path>
  <path d="M598 280H706" stroke="#C24B35" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrowRed)">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.7s" begin=".3s" repeatCount="indefinite"/>
  </path>
  <path d="M598 413H706" stroke="#B9770E" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrowGold)">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.7s" begin=".6s" repeatCount="indefinite"/>
  </path>
  <circle cy="147" r="5" fill="#16827E">
    <animate attributeName="cx" values="612;692;612" dur="2.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;1;.15" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cy="280" r="5" fill="#C24B35">
    <animate attributeName="cx" values="612;692;612" dur="2.7s" begin=".3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;1;.15" dur="2.7s" begin=".3s" repeatCount="indefinite"/>
  </circle>
  <circle cy="413" r="5" fill="#B9770E">
    <animate attributeName="cx" values="612;692;612" dur="2.7s" begin=".6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".15;1;.15" dur="2.7s" begin=".6s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="8s" repeatCount="indefinite"/>
    <rect x="706" y="82" width="332" height="384" rx="22" fill="#FFFFFF" stroke="#17181C" stroke-width="2"/>
    <text x="738" y="122" class="mono chip muted">PROJECT NODES</text>

    <rect x="738" y="146" width="126" height="40" rx="20" fill="#EAF9F7" stroke="#16827E"/>
    <text x="769" y="171" class="mono small">local-ai</text>
    <rect x="882" y="146" width="126" height="40" rx="20" fill="#EAF9F7" stroke="#16827E"/>
    <text x="895" y="171" class="mono small">question</text>

    <rect x="738" y="222" width="126" height="40" rx="20" fill="#FFF0EA" stroke="#C24B35"/>
    <text x="771" y="247" class="mono small">CozyNote</text>
    <rect x="882" y="222" width="126" height="40" rx="20" fill="#FFF0EA" stroke="#C24B35"/>
    <text x="901" y="247" class="mono small">auto-folder</text>
    <rect x="738" y="276" width="126" height="40" rx="20" fill="#FFF0EA" stroke="#C24B35"/>
    <text x="762" y="301" class="mono small">file-search</text>
    <rect x="882" y="276" width="126" height="40" rx="20" fill="#FFF0EA" stroke="#C24B35"/>
    <text x="904" y="301" class="mono small">web-builder</text>

    <rect x="738" y="352" width="126" height="40" rx="20" fill="#FFF8E1" stroke="#B9770E"/>
    <text x="771" y="377" class="mono small">MuWorld</text>
    <rect x="882" y="352" width="126" height="40" rx="20" fill="#FFF8E1" stroke="#B9770E"/>
    <text x="915" y="377" class="mono small">3D map</text>
    <rect x="738" y="406" width="126" height="40" rx="20" fill="#FFF8E1" stroke="#B9770E"/>
    <text x="761" y="431" class="mono small">War-Achive</text>
    <rect x="882" y="406" width="126" height="40" rx="20" fill="#FFF8E1" stroke="#B9770E"/>
    <text x="909" y="431" class="mono small">warsachive</text>
  </g>

  <path d="M1038 274H1084" stroke="#16827E" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrowTeal)">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.5s" repeatCount="indefinite"/>
    <rect x="1072" y="236" width="82" height="76" rx="18" fill="#FFFFFF" stroke="#16827E" stroke-width="2"/>
    <rect x="1088" y="254" width="50" height="20" rx="10" fill="#EAF9F7"/>
    <text x="1113" y="269" text-anchor="middle" class="mono chip" fill="#16827E">END</text>
    <text x="1113" y="294" text-anchor="middle" class="mono small">README</text>
  </g>
</svg>
