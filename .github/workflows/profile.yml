name: Refresh profile metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1'
permissions:
  contents: write
concurrency:
  group: profile-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh-profile.py
      - name: Commit changed metadata
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh public profile metadata'
          git push
      - name: Check profile links and assets
        run: python scripts/check-profile.py
